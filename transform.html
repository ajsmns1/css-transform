<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변형</title>
    <link rel="stylesheet" href="css/transform.css" />
  </head>
  <body>
    <!-- 이동 변형 -->
    <div class="container">
      <!-- x방향으로 이동 -->
      <div class="origin">
        <div class="move-x"></div>
      </div>
      <!-- y방향으로 이동 -->
      <div class="origin">
        <div class="move-y"></div>
      </div>
      <!-- xy방향으로 이동 -->
      <div class="origin">
        <div class="move-xy"></div>
      </div>
    </div>
    <!-- 확대 축소 변형 -->
    <div class="container">
      <!-- x방향으로 확대 -->
      <div class="origin">
        <div class="scale-x"></div>
      </div>
      <!-- y방향으로 확대 -->
      <div class="origin">
        <div class="scale-y"></div>
      </div>
      <!-- xy방향으로 확대 -->
      <div class="origin">
        <div class="scale"></div>
      </div>
    </div>
    <!-- 회전 변형 -->
    <div class="container">
      <div class="origin" id="rotate1">
        <img src="images/tree.jpg" alt="나무" />
      </div>
      <div class="origin" id="rotate2">
        <img src="images/tree.jpg" alt="나무" />
      </div>
    </div>
    <!-- 회전 변형 -->
    <div class="container">
      <div class="origin" id="rotate3">
        <img src="images/tree.jpg" alt="나무" />
      </div>
      <div class="origin" id="rotate4">
        <img src="images/tree.jpg" alt="나무" />
      </div>
    </div>
    <!-- 비틀기 -->
    <div class="container">
      <!-- x방향으로 이동 -->
      <div class="origin">
        <div class="skew-x"></div>
      </div>
      <!-- y방향으로 이동 -->
      <div class="origin">
        <div class="skew-y"></div>
      </div>
      <!-- xy방향으로 이동 -->
      <div class="origin">
        <div class="skew-xy"></div>
      </div>
    </div>
  </body>
</html>
